<!DOCTYPE html>
<html>

    <head>
        <title>Employee Payroll</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet" href="Styles/dashboard.css">
    </head>

    <body>

        <!-- Header -->
        <div class="top-header">
            <img src="Assets/Images/Emp-logo.jpeg" class="logo" alt="logo">
            <div class="logo-content">
                <span class="logo-text">EMPLOYEE</span>
                <span id="paycolor">PAYROLL</span>
            </div>
        </div>

        <!-- Main Content -->
        <main class="container my-5 px-3 px-md-5">
            <div class="card border-0 shadow-sm rounded-3 bg-white p-4">
                <!-- Header Area -->
                <div
                    class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-4 gap-3">
                    <h2 class="h4 m-0 fw-bold"
                        style="font-family: 'Roboto', sans-serif; color: #42515F; font-size: 28px;">
                        Employee Details
                    </h2>

                    <div class="d-flex align-items-center gap-3">
                        <!-- Search Container -->
                        <div class="search-container">
                            <button id="searchBtn">
                                <img src="Assets/Images/search.jpeg"
                                    alt="search" class="search-icon">
                            </button>
                            <input type="text" id="searchEmployee"
                                placeholder="Search Employee">
                        </div>

                        <!-- Add User Button -->
                        <button id="addUserBtn"
                            class="btn text-white px-4 d-flex align-items-center gap-2 fw-semibold border-0 shadow-sm"
                            style="background-color: #82A70C; height: 48px; border-radius: 5px; font-size: 16px;">
                            <span class="fs-4 lh-1">+</span>
                            <span>Add User</span>
                        </button>
                    </div>
                </div>

                <!-- Table Container -->
                <div class="table-responsive">
                    <table class="table table-hover align-middle m-0">
                        <thead>
                            <tr>
                                <th class="py-3 px-4"
                                    style="border-top-left-radius: 5px;">NAME</th>
                                <th class="py-3 px-3">GENDER</th>
                                <th class="py-3 px-3">DEPARTMENT</th>
                                <th class="py-3 px-3">SALARY</th>
                                <th class="py-3 px-3">START DATE</th>
                                <th class="py-3 px-3"
                                    style="border-top-right-radius: 5px;">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody id="employeeTable">
                            <!-- Dynamic records will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <!-- Bootstrap Bundle with Popper -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        
<script src="Scripts/JQuery/api.js"></script>
    <script src="Scripts/JQuery/dashboard.js"></script>
     

    </body>

</html>
